name: publish

on:
  schedule:
    # 12:00 UTC = 20:00 Asia/Shanghai
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/updates.json" # 数据提交本身不再触发一轮

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect recent commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect.py

      - name: Commit the fresh data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/updates.json; then
            echo "没有新提交，数据不变"
          else
            git add data/updates.json
            git commit -m "chore(data): refresh build log"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
